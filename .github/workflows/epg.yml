name: EPG aktualisieren
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EPG erzeugen
        run: python3 epg_generator.py
      - name: Committen
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml.gz
          git commit -m "EPG automatisch aktualisiert" || echo "keine Aenderung"
          git push
